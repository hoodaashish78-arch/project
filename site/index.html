<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free DevOps Project</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #1e293b;
        }

        main {
            padding: 70px 20px;
        }

        h1 {
            color: #38bdf8;
            font-size: 36px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .card {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #1e293b;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }

        footer {
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <header>
        <strong>ASHISH HOODA | DEVOPS LAB</strong>
    </header>

    <main>
        <h1>My First DevOps Project 🚀</h1>
        <p>Learning Linux, Git, Docker and CI/CD through practical projects.</p>

        <div class="card">
            <h2>Project Status</h2>
            <p class="status">Website Created Successfully!</p>
            <p>Next: Docker Containerization and GitHub Actions CI/CD.</p>
        </div>
    </main>

    <footer>
        Built by Ashish Hooda | Free DevOps Learning Project
    </footer>
</body>
</html>
